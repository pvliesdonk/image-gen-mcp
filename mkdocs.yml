repo_url: https://github.com/pvliesdonk/image-generation-mcp
repo_name: pvliesdonk/image-generation-mcp
edit_uri: edit/main/docs/

# Internal dev docs live under docs/ but are NOT part of the published site.
# Keep this set in lockstep with the Vale exclusion (ci.yml vale_flags glob +
# the pre-commit `- id: vale` exclude); see the Documentation Conventions
# section in AGENTS.md. superpowers/ is also gitignored.
exclude_docs: |
  design/**
  decisions/**
  releases/next.md
  superpowers/**

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

extra:
  version:
    provider: mike
    default: latest

extra_javascript:
  - path: javascripts/config-wizard/wizard.js
    type: module

extra_css:
  - stylesheets/config-wizard.css

plugins:
  - search
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >
        image-generation-mcp is a multi-provider image generation MCP server
        supporting OpenAI (gpt-image-1, dall-e-3), SD WebUI (Stable Diffusion WebUI,
        compatible with AUTOMATIC1111/Forge/reForge), and a zero-cost placeholder
        provider. Features keyword-based auto-selection, background tasks with
        progress reporting, and resource-based image transforms.
      sections:
        # PROJECT-LLMSTXT-SECTIONS-START — keep aligned with `nav:` below;
        # kept across copier update.
        Getting Started:
          - index.md: Overview -- features, providers, quick start
          - getting-started/installation.md: Installation from PyPI, uv, source, or Docker
          - getting-started/claude-desktop.md: Claude Desktop MCP configuration
          - getting-started/claude-code.md: Claude Code MCP configuration
          - configuration-generator.md: Interactive configuration wizard
        Providers:
          - providers/index.md: Provider comparison and selection guide
          - providers/gemini.md: Gemini provider setup and capabilities
          - providers/openai.md: OpenAI provider setup and capabilities
          - providers/sd-webui.md: SD WebUI (Stable Diffusion WebUI) setup
          - providers/model-catalog.md: Per-model narrative metadata catalog (auto-generated)
          - providers/placeholder.md: Zero-cost placeholder for testing
        Configuration:
          - configuration.md: All environment variables with types and defaults
        MCP Interface:
          - tools.md: MCP tools with parameters and examples
          - resources.md: MCP resources with URI patterns
          - prompts.md: MCP prompts with workflow descriptions
        Guides:
          - guides/authentication.md: Authentication modes -- bearer, OIDC, multi-auth
          - guides/image-input.md: Image input -- editing, composition, and masking via transform_image
          - guides/prompt-writing.md: Provider-specific prompt writing tips
          - guides/styles.md: Style library -- reusable creative briefs for consistent generation
        Deployment:
<<<<<<< before updating
          - deployment/docker.md: Docker Compose, Traefik, volumes
          - deployment/systemd.md: Systemd service, .deb/.rpm packages, security hardening
          - deployment/oidc.md: OIDC authentication setup
        # Glob deliberately: each minor's release-notes page is auto-indexed
        # without a sections-list update (same rationale as guides/*).
=======
          - deployment/*.md
        # Character-class prefix excludes the unversioned staging page while
        # auto-indexing each canonical minor page.
>>>>>>> after updating
        Release Notes:
          - releases/[0-9]*.[0-9]*.md
        # PROJECT-LLMSTXT-SECTIONS-END
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_bases: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            docstring_style: google
            merge_init_into_class: true
            show_if_no_docstring: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  # PROJECT-NAV-START — replace with your real navigation; kept across copier
  # update. Keep aligned with the `llmstxt` plugin's sentinel-protected
