# Domain presentation layer — YOURS to edit.  Preserved across copier update.
#
# Domain env vars are discovered automatically from your ProjectConfig's
# CONFIG-FIELDS block, using each field's `metadata={"help": ..., "tags": ...}`.
# Declare a var here only when it is read somewhere the scan cannot see it —
# a deprecated alias no longer read inside ProjectConfig.from_env, or a var
# read outside ProjectConfig.from_env entirely.
#
# Same shape as the template-owned config-presentation.yml.  `{PREFIX}` is
# substituted with your env_prefix.
#
# A var's `default:` key controls whether it renders required, the same way
# a dataclass field does: omit `default:` entirely to mark the var required,
# or give it `default: null` (or a real default) to mark it optional.
vars:
  # Deprecated aliases, read via the _legacy_a1111 helper outside
  # ProjectConfig.from_env (invisible to the AST scan by design).
  - name: "{PREFIX}_A1111_HOST"
    type_name: "str"
    default: null
    help: >-
      Deprecated alias for {PREFIX}_SD_WEBUI_HOST; logs a warning when used.
    tags: [providers]
    wizard: {control: none}
  - name: "{PREFIX}_A1111_MODEL"
    type_name: "str"
    default: null
    help: >-
      Deprecated alias for {PREFIX}_SD_WEBUI_MODEL; logs a warning when used.
    tags: [providers]
    wizard: {control: none}

# MCPB's template baseline deliberately exposes only generic server fields.
# Restore the project-specific desktop install screen through the documented
# overlay so the generator owns both user_config and its env wiring.
files:
  packaging/mcpb/manifest.json.in:
    fields:
      "{PREFIX}_SCRATCH_DIR":
        id: scratch_dir
        title: "Scratch directory"
        description: "Where generated images are saved. Blank uses ~/.image-generation-mcp/images."
        type: directory
        default: "${DOCUMENTS}/Image Generation MCP"
      "{PREFIX}_STYLES_DIR":
        id: styles_dir
        title: "Styles directory"
        description: "Where style preset files live. Blank uses ~/.image-generation-mcp/styles."
        type: directory
        default: null
      "{PREFIX}_READ_ONLY":
        id: read_only
        title: "Read-only mode"
        description: "When true, image-generation tools are hidden. Defaults to FALSE for MCPB bundles so local desktop installs can generate images."
        default: false
      "{PREFIX}_DEFAULT_PROVIDER":
        id: default_provider
        title: "Default provider"
        description: "One of: auto, openai, gemini, sd_webui, placeholder."
        default: auto
      "{PREFIX}_PAID_PROVIDERS":
        id: paid_providers
        title: "Paid providers"
        description: "Comma-separated providers that cost money and require confirmation."
        default: openai
      "{PREFIX}_OPENAI_API_KEY":
        id: openai_api_key
        title: "OpenAI API key"
        description: "Enables gpt-image-1 / dall-e-3. Stored in the OS keychain."
        sensitive: true
      "{PREFIX}_GOOGLE_API_KEY":
        id: google_api_key
        title: "Google API key"
        description: "Enables Gemini image generation. Stored in the OS keychain."
        sensitive: true
      "{PREFIX}_SD_WEBUI_HOST":
        id: sd_webui_host
        title: "SD WebUI host"
        description: "Base URL of an A1111/Forge/reForge instance (e.g. http://localhost:7860)."
      "{PREFIX}_SD_WEBUI_MODEL":
        id: sd_webui_model
        title: "SD WebUI model"
        description: "Checkpoint name used for preset detection (optional)."

# Extra wizard questions specific to this project.
wizard_routing: []

# Extra wizard guards specific to this project.  Keep these to genuinely
# domain-specific conditions: config-presentation.yml already ships an OIDC
# guard, and a ported duplicate here renders as a second near-identical
# warning in the wizard (these entries were inert until template v3.1.x
# started consuming them, which is why the overlap went unnoticed).
wizard_guards:
  - level: warning
    message: >-
      No provider is configured — the server will start but cannot generate
      images. Fill in at least one of: OpenAI API key, Google API key, or SD
      WebUI host.
    when:
      openai_api_key: [""]
      google_api_key: [""]
      sd_webui_host: [""]
